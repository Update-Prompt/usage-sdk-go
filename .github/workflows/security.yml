name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so newly published vulnerabilities are found even without changes
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A public repo can't use the private shared-actions, so this runs gitleaks directly
      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          version="${GITLEAKS_VERSION#v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/$GITLEAKS_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Pull requests scan their own commits, other runs the whole history. Findings are redacted.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --no-banner --redact .
          fi

  # Decides whether pull requests need the vulnerability scan. Pushes and the weekly run always scan.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/security.yml'
              - '.github/scripts/each-module.sh'

  govulncheck:
    name: vulnerabilities
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.9.0
        run: go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
      # Fails when the code calls a function with a known vulnerability, in the SDK or an adapter
      - name: Scan for vulnerabilities
        run: .github/scripts/each-module.sh govulncheck ./...
