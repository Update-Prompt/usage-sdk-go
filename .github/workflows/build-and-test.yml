name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides which jobs a change needs. If it fails, every job runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Go source, modules, the lint config and this workflow
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.golangci.yml'
              - '.github/workflows/build-and-test.yml'

  validate:
    name: go.mod is tidy
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod || { echo "::error::go.mod isn't tidy. Run 'go mod tidy' and commit the result."; exit 1; }
          if [ -f go.sum ]; then git diff --exit-code go.sum || { echo "::error::go.sum isn't tidy. Run 'go mod tidy' and commit the result."; exit 1; }; fi

  lint:
    name: Go lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt, goimports, errcheck, govet, staticcheck, unused and ineffassign, with .golangci.yml.
      # A public repo can't use the private shared-actions, so this runs golangci-lint directly.
      - uses: golangci/golangci-lint-action@v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.14.0

  test:
    name: tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet the Go code
        run: go vet ./...
      - name: Run the tests
        run: go test -race ./...

  # The go line in go.mod is the oldest Go apps may use, so the code must still build and pass there
  test-oldest-go:
    name: tests on the oldest Go
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    env:
      # Use the installed Go, not the newer toolchain go.mod names
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - name: Run the tests
        run: go test -race ./...
